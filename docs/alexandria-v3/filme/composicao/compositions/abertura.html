    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power2.out";
      tl.fromTo("#ab-tit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.4, ease: E }, 0.6);

      tl.to("#ab-grupo", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 6.6);
